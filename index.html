document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ondensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b0fb5d8c-de53-4c81-b9bc-cdb6eec2482d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f52511ac-14d3-483d-a599-362898cfc8c5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0ac8152b-5a44-4dc0-8273-6fefc310e122\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"894de33d-8fe8-4c9c-a55d-6aac1357b97d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f2691404-fafb-435b-a37e-a135a61098c4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"67a226ab-40df-4acb-bfff-690a92882a76\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps \u2014 generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation \u2014 derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Components \u2014 built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* \u2014 rules \u2014 */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* \u2014 buttons \u2014 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px \u2014\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* \u2014 forms \u2014 */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* \u2014 cards \u2014 */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* \u2014 tags \u2014 */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* \u2014 navigation \u2014 */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* \u2014 tables \u2014 */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* \u2014 dialog \u2014 */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* \u2014 blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) \u2014 square, transparent, hairline-bordered \u2014 */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #f2f2f3; color: #1d1f20; -webkit-font-smoothing: antialiased; }\n  a { color: #416180; text-decoration: none; }\n  a:hover { color: #1d2d3d; }\n  @keyframes drawline { to { stroke-dashoffset: 0; } }\n  @keyframes fadein { to { opacity: 1; } }\n  ::selection { background: #b5d9fd; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: Barlow, system-ui, sans-serif; font-size: 16px; line-height: 1.55; overflow-x: hidden;\">\n\n  <header style=\"position: sticky; top: 0; z-index: 20; background: rgba(242,242,243,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(29,31,32,0.16);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px;\">\n      <a href=\"#top\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.02em; color: #1d1f20; margin-right: auto;\">asql<\u002Fa>\n      <a href=\"#why\" style=\"font-size: 14px; color: #424244;\" style-hover=\"color: #416180;\">Why asql<\u002Fa>\n      <a href=\"#compiler\" style=\"font-size: 14px; color: #424244;\" style-hover=\"color: #416180;\">Compiler, not generator<\u002Fa>\n      <a href=\"#example\" style=\"font-size: 14px; color: #424244;\" style-hover=\"color: #416180;\">Example<\u002Fa>\n      <a href=\"#install\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 14px; padding: 7px 14px; border: 1px solid #5980a6; background: #5980a6; color: #f2f2f3;\" style-hover=\"background: #416180; border-color: #416180;\">Install<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px 0;\">\n    <div data-reveal=\"\" style=\"max-width: 880px;\">\n      <div style=\"display: flex; align-items: center; gap: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #416180; margin-bottom: 28px;\">\n        <span style=\"width: 28px; height: 1px; background: #5980a6; display: block;\"><\u002Fspan>\n        <span>SQL in. One HTML file out.<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: clamp(52px, 8vw, 104px); line-height: 0.96; letter-spacing: -0.02em; margin: 0 0 28px;\">Write SQL.<br>Get a dashboard.<\u002Fh1>\n      <p style=\"font-size: clamp(17px, 2vw, 21px); line-height: 1.5; max-width: 640px; margin: 0 0 36px; color: #2b2b2d; text-wrap: pretty;\">Write the SQL query you already know how to write, add a few <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 2px 6px;\">-- @<\u002Fcode> comments, and asql renders it into a polished, self-contained HTML analytics report. No BI tool, no notebook, no JavaScript, no <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 2px 6px;\">&lt;div&gt;<\u002Fcode> wrangling.<\u002Fp>\n    <\u002Fdiv>\n\n    <div id=\"install\" data-reveal=\"\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; scroll-margin-top: 90px;\">\n      <div class=\"blueprint\" style=\"display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: #1d2d3d;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; color: #d6ebff; white-space: nowrap;\"><span style=\"color: #749dc4;\">$<\u002Fspan> curl -fsSL https://cuiqanalytics.github.io/asql/install.sh | sh<\u002Fcode>\n        <button sc-camel-on-click=\"{{ copy }}\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border: 1px solid #416180; background: transparent; color: #b5d9fd; cursor: pointer;\" style-hover=\"background: #2c455d;\">{{ copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size: 14px; color: #5d5d60;\">First dashboard in about 60 seconds.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 14px; font-size: 13px; color: #5d5d60; max-width: 640px;\">Prefer Docker? No binary to unpack:<pre style=\"margin: 8px 0 0; padding: 10px 14px; background: #e7e7ea; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; color: #1d1f20; white-space: pre-wrap; overflow-x: auto;\">docker pull ghcr.io/cuiqanalytics/asql\ndocker run --rm -v $PWD:/work ghcr.io/cuiqanalytics/asql build report.sql<\u002Fpre><\u002Fdiv>\n\n    <figure data-reveal=\"\" class=\"blueprint\" style=\"margin: 64px 0 0; padding: 0; background: #ffffff; max-height: 620px; overflow: hidden;\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <img src=\"f0adb5ca-7aab-42ba-9f8a-1e0552c399b5\" alt=\"An asql dashboard: interactive Vega-Lite charts, KPI cards and segment breakdowns.\" style=\"width: 100%; display: block;\">\n      <div style=\"position: absolute; inset: auto 0 0 0; height: 180px; background: linear-gradient(rgba(242,242,243,0), #f2f2f3); pointer-events: none;\"><\u002Fdiv>\n    <\u002Ffigure>\n    <figcaption style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #7a7a7d; margin-top: 14px;\">Real output \u2014 <span style=\"color: #416180;\">asql build report.sql<\u002Fspan><\u002Ffigcaption>\n  <\u002Fsection>\n\n  <section id=\"why\" style=\"max-width: 1180px; margin: 0 auto; padding: 120px 32px 0; scroll-margin-top: 80px;\">\n    <h2 data-reveal=\"\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.015em; margin: 0 0 48px;\">Why asql<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px 48px;\">\n      <div data-reveal=\"\">\n        <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5980a6; margin-bottom: 14px;\">01<\u002Fdiv>\n        <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 10px;\">The chart is inferred, not configured.<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; color: #424244; text-wrap: pretty;\">Tag a query <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">trend<\u002Fcode>, <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">ranking<\u002Fcode>, <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">funnel<\u002Fcode>, <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">waterfall<\u002Fcode>, <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">heatmap<\u002Fcode>. asql reads the result shape and picks the mark, axes, series grouping, colors and number formats. No charting API to learn.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5980a6; margin-bottom: 14px;\">02<\u002Fdiv>\n        <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 10px;\">One file in, one file out.<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; color: #424244; text-wrap: pretty;\">Input is runnable SQL. Output is a single <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">.html<\u002Fcode> \u2014 no asset folder. Email it, commit it, drop it on any static host.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5980a6; margin-bottom: 14px;\">03<\u002Fdiv>\n        <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 10px;\">It stays SQL.<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; color: #424244; text-wrap: pretty;\">Every annotation is a <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">--<\u002Fcode> comment. <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 1px 5px;\">duckdb &lt; report.sql<\u002Fcode> still works. The file never stops being valid, runnable SQL.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5980a6; margin-bottom: 14px;\">04<\u002Fdiv>\n        <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 10px;\">Two audiences, one source.<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; color: #424244; text-wrap: pretty;\">The same file builds an interactive dashboard or a print-ready narrative memo. One metadata line switches format.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"compiler\" style=\"margin: 120px 0 0; background: #1d2d3d; color: #e7e7ea; scroll-margin-top: 60px;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 104px 32px 112px;\">\n      <div data-reveal=\"\" style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #94bce3; margin-bottom: 28px;\">Why not just ask an AI to build me a dashboard?<\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: clamp(44px, 6.5vw, 86px); line-height: 1; letter-spacing: -0.02em; margin: 0 0 32px; max-width: 15ch;\">It's a compiler, not a generator.<\u002Fh2>\n      <p data-reveal=\"\" style=\"max-width: 620px; font-size: 18px; line-height: 1.55; color: #b5d9fd; margin: 0 0 72px; text-wrap: pretty;\">You can prompt an AI app builder for a dashboard and get one. asql is a different kind of tool.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(46%, 1fr)); gap: 1px; background: rgba(148,188,227,0.28);\">\n        <div data-reveal=\"\" style=\"background: #1d2d3d; padding: 32px 28px 36px;\">\n          <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; margin: 0 0 12px; color: #ffffff;\">Same input, same output, every time.<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; color: #bdd8f2; text-wrap: pretty;\">A prompt-generated dashboard is a fresh one-off each time you ask \u2014 re-run it and you may get a different layout, different chart choices, different code. <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; color: #ffffff;\">asql build report.sql<\u002Fcode> renders the same result every time.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"background: #1d2d3d; padding: 32px 28px 36px;\">\n          <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; margin: 0 0 12px; color: #ffffff;\">Still just SQL, not a new app to maintain.<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; color: #bdd8f2; text-wrap: pretty;\">A generated dashboard is a new codebase \u2014 React, config, glue \u2014 that only the AI that wrote it really understands. Changing an asql report means editing the query you already had.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"background: #1d2d3d; padding: 32px 28px 36px;\">\n          <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; margin: 0 0 12px; color: #ffffff;\">Diffable and reviewable.<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; color: #bdd8f2; text-wrap: pretty;\"><code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; color: #ffffff;\">git diff report.sql<\u002Fcode> is a SQL diff anyone can read. No generated UI code to review.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"background: #1d2d3d; padding: 32px 28px 36px;\">\n          <h3 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; margin: 0 0 12px; color: #ffffff;\">No runtime you depend on.<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; color: #bdd8f2; text-wrap: pretty;\">One static <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; color: #ffffff;\">.html<\u002Fcode> file \u2014 no hosted app, no vendor account to view it, no server in the loop. Open it in five years.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"example\" style=\"max-width: 1180px; margin: 0 auto; padding: 120px 32px 0; scroll-margin-top: 80px;\">\n    <h2 data-reveal=\"\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.015em; margin: 0 0 12px;\">See it work<\u002Fh2>\n    <p data-reveal=\"\" style=\"max-width: 620px; font-size: 17px; color: #424244; margin: 0 0 48px;\">Three lines of SQL comments. One multi-series line chart. In the full example the other charts carry no type at all \u2014 asql infers them.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; align-items: start;\">\n      <div data-reveal=\"\" class=\"blueprint\" style=\"background: #1d2d3d; padding: 28px 26px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #749dc4; margin-bottom: 18px;\">report.sql<\u002Fdiv>\n        <pre style=\"margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; line-height: 1.7; color: #e7e7ea;\"><span style=\"display: block; color: #94bce3;\">-- @report<\u002Fspan><span style=\"display: block; color: #94bce3;\">-- title: Revenue Dashboard<\u002Fspan><span style=\"display: block; color: #94bce3;\">-- subtitle: 2026<\u002Fspan><span style=\"display: block; height: 1.7em;\"> <\u002Fspan><span style=\"display: block; color: #94bce3;\">-- @chart: trend<\u002Fspan><span style=\"display: block; color: #94bce3;\">-- title: Monthly Revenue by Channel<\u002Fspan><span style=\"display: block; height: 1.7em;\"> <\u002Fspan><span style=\"display: block; color: #b5d9fd;\">SELECT<\u002Fspan><span style=\"display: block;\">    date_trunc(<span style=\"color: #bdd8f2;\">'month'<\u002Fspan>, order_date) <span style=\"color: #b5d9fd;\">AS<\u002Fspan> date,<\u002Fspan><span style=\"display: block;\">    acquisition_channel             <span style=\"color: #b5d9fd;\">AS<\u002Fspan> series,<\u002Fspan><span style=\"display: block;\">    sum(revenue)                    <span style=\"color: #b5d9fd;\">AS<\u002Fspan> value<\u002Fspan><span style=\"display: block;\"><span style=\"color: #b5d9fd;\">FROM<\u002Fspan> read_csv_auto(<span style=\"color: #bdd8f2;\">'orders.csv'<\u002Fspan>)<\u002Fspan><span style=\"display: block;\"><span style=\"color: #b5d9fd;\">GROUP BY<\u002Fspan> <span style=\"color: #bdd8f2;\">1<\u002Fspan>, <span style=\"color: #bdd8f2;\">2<\u002Fspan><\u002Fspan><span style=\"display: block;\"><span style=\"color: #b5d9fd;\">ORDER BY<\u002Fspan> <span style=\"color: #bdd8f2;\">1<\u002Fspan>;<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" class=\"blueprint\" style=\"background: #ffffff; padding: 26px 24px 22px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 19px; margin-bottom: 4px;\">Monthly Revenue by Channel<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #7a7a7d; margin-bottom: 14px;\">Revenue Dashboard \u00b7 2026<\u002Fdiv>\n        <svg data-chart=\"\" sc-camel-view-box=\"0 0 720 300\" style=\"width: 100%; height: auto; display: block;\">\n          <g stroke=\"#e7e7ea\" stroke-width=\"1\">\n            <line x1=\"60\" y1=\"30\" x2=\"700\" y2=\"30\"><\u002Fline>\n            <line x1=\"60\" y1=\"85\" x2=\"700\" y2=\"85\"><\u002Fline>\n            <line x1=\"60\" y1=\"140\" x2=\"700\" y2=\"140\"><\u002Fline>\n            <line x1=\"60\" y1=\"195\" x2=\"700\" y2=\"195\"><\u002Fline>\n          <\u002Fg>\n          <line x1=\"60\" y1=\"250\" x2=\"700\" y2=\"250\" stroke=\"#b7b7ba\" stroke-width=\"1\"><\u002Fline>\n          <g fill=\"#7a7a7d\" font-family=\"ui-monospace, Menlo, monospace\" font-size=\"11\" text-anchor=\"end\">\n            <text x=\"50\" y=\"34\">900k<\u002Ftext>\n            <text x=\"50\" y=\"89\">675k<\u002Ftext>\n            <text x=\"50\" y=\"144\">450k<\u002Ftext>\n            <text x=\"50\" y=\"199\">225k<\u002Ftext>\n            <text x=\"50\" y=\"254\">0<\u002Ftext>\n          <\u002Fg>\n          <g fill=\"#7a7a7d\" font-family=\"ui-monospace, Menlo, monospace\" font-size=\"11\" text-anchor=\"middle\">\n            <text x=\"60\" y=\"272\">Jan<\u002Ftext>\n            <text x=\"234\" y=\"272\">Apr<\u002Ftext>\n            <text x=\"409\" y=\"272\">Jul<\u002Ftext>\n            <text x=\"583\" y=\"272\">Oct<\u002Ftext>\n          <\u002Fg>\n          <g fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" sc-camel-path-length=\"1\" stroke-dasharray=\"1\" stroke-dashoffset=\"1\">\n            <path d=\"M60,198.7 L118.2,186.4 L176.4,179.1 L234.5,169.3 L292.7,157.1 L350.9,144.9 L409.1,135.1 L467.3,122.9 L525.5,113.1 L583.6,100.9 L641.8,88.7 L700,74\" stroke=\"#2c455d\"><\u002Fpath>\n            <path d=\"M60,206 L118.2,201.1 L176.4,191.3 L234.5,186.4 L292.7,188.9 L350.9,179.1 L409.1,174.2 L467.3,169.3 L525.5,162 L583.6,157.1 L641.8,149.8 L700,142.4\" stroke=\"#5980a6\"><\u002Fpath>\n            <path d=\"M60,235.3 L118.2,230.4 L176.4,228 L234.5,220.7 L292.7,215.8 L350.9,213.3 L409.1,203.6 L467.3,198.7 L525.5,191.3 L583.6,186.4 L641.8,176.7 L700,166.9\" stroke=\"#9ebbd8\"><\u002Fpath>\n          <\u002Fg>\n        <\u002Fsvg>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 12px; color: #424244;\">\n          <span style=\"display: inline-flex; align-items: center; gap: 7px;\"><span style=\"width: 14px; height: 2px; background: #2c455d; display: block;\"><\u002Fspan>Direct<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; gap: 7px;\"><span style=\"width: 14px; height: 2px; background: #5980a6; display: block;\"><\u002Fspan>Paid<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; gap: 7px;\"><span style=\"width: 14px; height: 2px; background: #9ebbd8; display: block;\"><\u002Fspan>Partner<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1180px; margin: 0 auto; padding: 120px 32px 0;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 56px; align-items: center;\">\n      <div data-reveal=\"\">\n        <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #416180; margin-bottom: 20px;\">Narrative format<\u002Fdiv>\n        <h2 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1.05; letter-spacing: -0.015em; margin: 0 0 20px;\">One source, two audiences.<\u002Fh2>\n        <p style=\"font-size: 17px; color: #424244; margin: 0 0 20px; max-width: 46ch; text-wrap: pretty;\">Add one line \u2014 <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: #e7e7ea; padding: 2px 6px;\">-- format: narrative<\u002Fcode> \u2014 and the same file builds as a print-ready, single-column document with a table of contents and templated prose that pulls real numbers from the queries.<\u002Fp>\n        <p style=\"font-size: 17px; color: #424244; margin: 0; max-width: 46ch;\">Same source. Different audience.<\u002Fp>\n      <\u002Fdiv>\n      <figure data-reveal=\"\" class=\"blueprint\" style=\"margin: 0; background: #ffffff; max-height: 560px; overflow: hidden;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <img src=\"0fad5821-bcac-4dcf-888b-36e6c85b2213\" alt=\"The same asql report built as a narrative memo: title, table of contents, prose and inline figures.\" style=\"width: 100%; display: block;\">\n        <div style=\"position: absolute; inset: auto 0 0 0; height: 140px; background: linear-gradient(rgba(242,242,243,0), #f2f2f3); pointer-events: none;\"><\u002Fdiv>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1180px; margin: 0 auto; padding: 128px 32px 0;\">\n    <div data-reveal=\"\" style=\"max-width: 700px;\">\n      <h2 style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: clamp(32px, 4.4vw, 52px); line-height: 1.05; letter-spacing: -0.015em; margin: 0 0 24px;\">It grows with you.<\u002Fh2>\n      <p style=\"font-size: 18px; line-height: 1.55; color: #424244; margin: 0 0 16px; text-wrap: pretty;\">Today asql is free, runs on your machine, and leaves nothing behind but a file you own. That isn't a limitation to be fixed later \u2014 it's the foundation.<\u002Fp>\n      <p style=\"font-size: 18px; line-height: 1.55; color: #424244; margin: 0; text-wrap: pretty;\">The same annotated SQL that builds a file on your laptop is what will keep a hosted dashboard current on a schedule. Same input, more places to put the output.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 48px;\">\n      <div class=\"blueprint\" style=\"display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: #1d2d3d;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <code style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; color: #d6ebff; white-space: nowrap;\"><span style=\"color: #749dc4;\">$<\u002Fspan> curl -fsSL https://cuiqanalytics.github.io/asql/install.sh | sh<\u002Fcode>\n        <button sc-camel-on-click=\"{{ copy }}\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border: 1px solid #416180; background: transparent; color: #b5d9fd; cursor: pointer;\" style-hover=\"background: #2c455d;\">{{ copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top: 14px; font-size: 13px; color: #5d5d60; max-width: 640px;\">Prefer Docker? No binary to unpack:<pre style=\"margin: 8px 0 0; padding: 10px 14px; background: #e7e7ea; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; color: #1d1f20; white-space: pre-wrap; overflow-x: auto;\">docker pull ghcr.io/cuiqanalytics/asql\ndocker run --rm -v $PWD:/work ghcr.io/cuiqanalytics/asql build report.sql<\u002Fpre><\u002Fdiv>\n      <a href=\"#top\" style=\"font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.04em; padding: 13px 18px; border: 1px solid rgba(29,31,32,0.16); color: #1d1f20;\" style-hover=\"background: rgba(29,31,32,0.07);\">Read the docs<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width: 1180px; margin: 112px auto 0; padding: 32px; border-top: 1px solid rgba(29,31,32,0.16); display: flex; flex-wrap: wrap; gap: 20px; align-items: baseline; justify-content: space-between;\">\n    <div style=\"font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #7a7a7d;\">This page, like every asql report, is one file.<\u002Fdiv>\n    <div style=\"display: flex; gap: 24px; font-size: 14px;\">\n      <a href=\"#top\" style=\"color: #424244;\" style-hover=\"color: #416180;\">GitHub<\u002Fa>\n      <a href=\"#top\" style=\"color: #424244;\" style-hover=\"color: #416180;\">Docs<\u002Fa>\n      <a href=\"#example\" style=\"color: #424244;\" style-hover=\"color: #416180;\">Example<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280}}\">\nclass Component extends DCLogic {\n  state = { copied: false };\n\n  componentDidMount() {\n    const root = this.el || document;\n    const nodes = Array.from(root.querySelectorAll('[data-reveal]'));\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    nodes.forEach((n, i) => {\n      if (reduce) return;\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(16px)';\n      n.style.transition = 'opacity .65s cubic-bezier(.22,.61,.36,1), transform .65s cubic-bezier(.22,.61,.36,1)';\n      n.style.transitionDelay = ((i % 4) * 70) + 'ms';\n    });\n    const show = (n) => { n.style.opacity = '1'; n.style.transform = 'none'; };\n    if (!reduce && 'IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n      nodes.forEach((n) => io.observe(n));\n      this._io = io;\n      this._fallback = setTimeout(() => nodes.forEach(show), 2500);\n    }\n\n    const charts = Array.from(root.querySelectorAll('[data-chart] path'));\n    if (charts.length && !reduce) {\n      const cio = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          Array.from(e.target.querySelectorAll('path')).forEach((p, i) => {\n            p.style.animation = 'drawline 1.1s cubic-bezier(.4,0,.2,1) ' + (i * 160) + 'ms forwards';\n          });\n          cio.unobserve(e.target);\n        });\n      }, { threshold: 0.3 });\n      root.querySelectorAll('[data-chart]').forEach((c) => cio.observe(c));\n      this._cio = cio;\n    } else {\n      charts.forEach((p) => { p.style.strokeDashoffset = '0'; });\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._cio) this._cio.disconnect();\n    clearTimeout(this._fallback);\n    clearTimeout(this._t);\n  }\n\n  renderVals() {\n    return {\n      copyLabel: this.state.copied ? 'Copied' : 'Copy',\n      copy: () => {\n        const cmd = 'curl -fsSL https://cuiqanalytics.github.io/asql/install.sh | sh';\n        if (navigator.clipboard) navigator.clipboard.writeText(cmd).catch(() => {});\n        this.setState({ copied: true });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ copied: false }), 1600);\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
